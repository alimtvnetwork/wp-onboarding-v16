name: Go Lint & Quality Gates

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Go Build Check
        working-directory: backend
        run: go build ./...

      - name: Go Vet
        working-directory: backend
        run: go vet ./...

      - name: Go Tests
        working-directory: backend
        run: go test ./...

      - name: Lint — File Size (backend)
        run: bash scripts/lint-file-size.sh

      - name: Lint — File Size (tools)
        run: bash scripts/lint-file-size.sh --dir tools/consistency-checker

      - name: Lint — Function Size (backend)
        run: bash scripts/lint-func-size.sh

      - name: Lint — Function Size (tools)
        run: bash scripts/lint-func-size.sh --dir tools/consistency-checker

      - name: Lint — Negative Naming
        run: bash scripts/lint-negative.sh

      - name: Lint — Import Grouping
        run: bash scripts/lint-imports.sh

      - name: Lint — Generic Enforce (Go)
        run: bash scripts/lint-ge.sh --go

      - name: Validate OpenAPI Spec
        working-directory: backend
        run: |
          if [ -f api/openapi.json ]; then
            npx --yes @redocly/cli lint api/openapi.json --skip-rule no-unused-components
          else
            echo "No OpenAPI spec found, skipping"
          fi
