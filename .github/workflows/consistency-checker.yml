name: Consistency Checker

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'licensing/**'
      - 'wp-plugins/**'
      - 'tools/consistency-checker/**'

jobs:
  consistency-check:
    name: Run Consistency Checker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: tools/consistency-checker/go.sum

      - name: Build checker
        working-directory: tools/consistency-checker
        run: go build -o checker ./cmd/checker

      - name: Run consistency checks
        working-directory: tools/consistency-checker
        run: ./checker --dir ../../backend --format json --dry-run
